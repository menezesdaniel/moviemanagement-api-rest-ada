# Configurações da Aplicação
spring.application.name=gerenciamento-filmes
server.port=8080

# Configurações do H2 Database
spring.datasource.url=jdbc:h2:mem:filmesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Console H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# API Externa OMDB (opcional - você pode usar sua própria chave gratuita)
# Obtenha em: http://www.omdbapi.com/apikey.aspx
omdb.api.key=sua-chave-aqui
omdb.api.url=http://www.omdbapi.com/